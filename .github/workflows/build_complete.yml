name: Ph3ntom-Spoofer-Complete

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install WDK and Visual Studio Build Tools
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0, 18.0)'
          msbuild-architecture: x64
      
      - name: Setup WDK Environment
        shell: pwsh
        run: |
          $vsInstallDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise"
          $wdkInclude = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
          
          Write-Host "Checking VS Install Dir: $vsInstallDir"
          Write-Host "Checking WDK Include Dir: $wdkInclude"
          
          if (Test-Path "$vsInstallDir") {
            Write-Host "VS 2022 found at: $vsInstallDir"
          } else {
            Write-Host "VS 2022 NOT found at: $vsInstallDir"
          }
          
          if (Test-Path "$wdkInclude") {
            Write-Host "WDK Include found at: $wdkInclude"
            $versions = Get-ChildItem -Path "$wdkInclude" -Directory | Where-Object { $_.Name -match "^10\.\d+\.\d+\.\d+$" } | Sort-Object Name -Descending
            if ($versions.Count -gt 0) {
              $latestVersion = $versions[0].Name
              Write-Host "Latest WDK version: $latestVersion"
              
              $ntddkPath = "$wdkInclude\$latestVersion\km\ntddk.h"
              if (Test-Path $ntddkPath) {
                Write-Host "ntddk.h found at: $ntddkPath"
                Add-Content -Path $env:GITHUB_ENV -Value "WDK_VERSION=$latestVersion"
                Add-Content -Path $env:GITHUB_ENV -Value "WDK_KM_INCLUDE=$wdkInclude\$latestVersion\km"
                Add-Content -Path $env:GITHUB_ENV -Value "WDK_LIB=$env:ProgramFiles(x86)\Windows Kits\10\Lib\$latestVersion\km\x64"
                exit 0
              } else {
                Write-Error "ntddk.h NOT found at: $ntddkPath"
                Get-ChildItem -Path "$wdkInclude\$latestVersion\km" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
                exit 1
              }
            } else {
              Write-Error "No WDK version directories found"
              Get-ChildItem -Path "$wdkInclude" -Directory | Select-Object Name
              exit 1
            }
          } else {
            Write-Error "WDK Include directory NOT found at: $wdkInclude"
            Write-Host "Searching for WDK..."
            Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits" -Recurse -Directory -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }
      
      - name: Build
        shell: cmd
        run: |
          call "${{ env.VS_INSTALL_PATH }}\VC\Auxiliary\Build\vcvars64.bat"
          
          set KITVER=%WDK_VERSION%
          set KITINC=%WDK_KM_INCLUDE%
          set KITLIB=%WDK_LIB%
          
          echo [INFO] WDK Version: %KITVER%
          echo [INFO] WDK Include: %KITINC%
          echo [INFO] WDK Lib: %KITLIB%
          
          if not exist "%KITINC%\ntddk.h" (
            echo [ERROR] ntddk.h not found at %KITINC%\ntddk.h
            dir "%KITINC%"
            exit /b 1
          )
          
          set INCLUDE=%KITINC%;%KITINC%\..\shared;%INCLUDE%
          set LIB=%KITLIB%;%LIB%
          
          mkdir bin
          cd extracted\hwid-spoofer\driver
          msbuild driver.vcxproj /p:Configuration=Release /p:Platform=x64 /p:OutDir=..\..\..\bin\ /nologo /m /p:WindowsTargetPlatformVersion=10.0 /p:TargetVersion=Windows10
          cd ..\mapper
          msbuild mapper.vcxproj /p:Configuration=Release /p:Platform=x64 /p:OutDir=..\..\..\bin\ /nologo /m
      
      - name: Download Intel Driver
        shell: pwsh
        run: |
          $url = "https://github.com/Ch0pin/medusa/raw/master/iqvw64e.sys"
          $out = "bin/iqvw64e.sys"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ph3ntom-binaries
          path: bin/
