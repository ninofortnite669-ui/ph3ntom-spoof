name: build-spoof

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: unzip-if-needed
        shell: pwsh
        run: |
          $z = Get-ChildItem -Filter *.zip | Select-Object -First 1
          if ($z) { Expand-Archive $z.FullName -DestinationPath "$pwd\src" -Force }

      - name: wdk
        shell: pwsh
        run: |
          $vs = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $inst = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise"
          if (-not (Test-Path $inst)) { $inst = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Community" }
          if (Test-Path $vs) {
            Start-Process $vs -ArgumentList "modify --installPath `"$inst`" --add Component.Microsoft.Windows.DriverKit --quiet --norestart --nocache" -Wait -NoNewWindow
          }
          $wdk = "$env:TEMP\wdksetup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2249371" -OutFile $wdk
          Start-Process $wdk -ArgumentList "/features + /quiet /norestart" -Wait

      - name: msbuild
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Recurse -Filter spoofer.sln | Select-Object -First 1
          if (-not $sln) { $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1 }
          if (-not $sln) { throw "no sln" }
          msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /m /v:m

      - uses: actions/upload-artifact@v4
        with:
          name: spoof-bin
          path: |
            **/*.sys
            **/mapper.exe
            **/bin/*
          if-no-files-found: warn
