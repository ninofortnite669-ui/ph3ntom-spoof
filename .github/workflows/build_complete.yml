name: Ph3ntom-Spoofer-Complete

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0, 18.0)'
      
      - name: Create bin directory
        run: mkdir -p extracted\hwid-spoofer\bin
        shell: cmd
      
      - name: Build Driver
        shell: cmd
        run: |
          call "${{ env.VS_INSTALL_PATH }}\VC\Auxiliary\Build\vcvars64.bat"
          cd extracted\hwid-spoofer\driver
          msbuild driver.vcxproj /p:Configuration=Release /p:Platform=x64 /p:OutDir=..\..\..\bin\ /nologo /m
      
      - name: Build Mapper
        shell: cmd
        run: |
          call "${{ env.VS_INSTALL_PATH }}\VC\Auxiliary\Build\vcvars64.bat"
          cd extracted\hwid-spoofer\mapper
          msbuild mapper.vcxproj /p:Configuration=Release /p:Platform=x64 /p:OutDir=..\..\..\bin\ /nologo /m
      
      - name: Download Intel Driver
        shell: cmd
        run: |
          powershell -Command "Invoke-WebRequest -Uri 'https://github.com/Ch0pin/medusa/raw/master/iqvw64e.sys' -OutFile 'extracted/hwid-spoofer/bin/iqvw64e.sys' -UseBasicParsing"
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ph3ntom-binaries
          path: extracted/hwid-spoofer/bin/
