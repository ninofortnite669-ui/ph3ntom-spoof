name: build-spoof

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  mapper:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: unzip
        shell: pwsh
        run: |
          $z = Get-ChildItem -Filter *.zip | Select-Object -First 1
          if ($z) { Expand-Archive $z.FullName -DestinationPath "$pwd\src" -Force }
      - name: build-mapper
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter mapper.vcxproj | Select-Object -First 1
          if (-not $proj) { throw "no mapper.vcxproj" }
          msbuild $proj.FullName /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m /v:m
      - uses: actions/upload-artifact@v4
        with:
          name: mapper-exe
          path: |
            **/mapper.exe
            **/bin/*.exe
          if-no-files-found: warn

  driver:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: unzip
        shell: pwsh
        run: |
          $z = Get-ChildItem -Filter *.zip | Select-Object -First 1
          if ($z) { Expand-Archive $z.FullName -DestinationPath "$pwd\src" -Force }
      - name: wdk
        shell: pwsh
        run: |
          $wdk = "$env:TEMP\wdksetup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2249371" -OutFile $wdk
          Start-Process $wdk -ArgumentList "/features + /quiet /norestart" -Wait
      - name: build-sys
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          for /d %%I in ("C:\Program Files (x86)\Windows Kits\10\Include\10.*") do set KITVER=%%~nxI
          echo KITVER=%KITVER%
          set KITINC=C:\Program Files (x86)\Windows Kits\10\Include\%KITVER%
          set KITLIB=C:\Program Files (x86)\Windows Kits\10\Lib\%KITVER%\km\x64
          set INCLUDE=%KITINC%\km;%KITINC%\shared;%KITINC%\km\crt;%INCLUDE%
          set LIB=%KITLIB%;%LIB%
          if not exist "%KITINC%\km\ntddk.h" (
            echo ntddk.h missing
            dir /s /b "C:\Program Files (x86)\Windows Kits\10\Include\*\km\ntddk.h"
            exit /b 1
          )
          for /f %%P in ('dir /s /b entry.c') do cd /d %%~dpP
          cl /c /nologo /W3 /O2 /GS- /kernel /D_AMD64_ /D_WIN64 entry.c disk_spoof.c smbios_spoof.c nic_spoof.c /I..\include
          link /nologo /DRIVER /SUBSYSTEM:NATIVE /ENTRY:DriverEntry /OUT:spoofer.sys entry.obj disk_spoof.obj smbios_spoof.obj nic_spoof.obj ntoskrnl.lib hal.lib wmilib.lib
      - uses: actions/upload-artifact@v4
        with:
          name: spoofer-sys
          path: |
            **/spoofer.sys
          if-no-files-found: warn
