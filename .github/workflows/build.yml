name: Ph3ntom-Spoofer-Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hwid-spoofer/**'

jobs:
  build:
    runs-on: windows-2022
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0, 18.0)'
      
      - name: Create Output Directory
        run: mkdir -p hwid-spoofer\bin
        shell: cmd
      
      - name: Detect WDK Paths
        id: detect-wdk
        shell: cmd
        run: |
          :: WDK est pré-installé avec VS 2022 sur GitHub Actions windows-2022
          :: Chemin standard: C:\Program Files (x86)\Windows Kits\10
          
          :: Trouver la version la plus récente du WDK
          for /d %%V in ("C:\Program Files (x86)\Windows Kits\10\Include\10.*") do (
            set WDK_VER=%%~nxV
          )
          
          :: Si aucune version trouvée, essayer le chemin direct
          if "%WDK_VER%"=="" (
            for /d %%V in ("C:\Program Files (x86)\Windows Kits\10\Include\*" ) do (
              set WDK_VER=%%~nxV
            )
          )
          
          :: Vérifier que ntddk.h existe
          if not exist "C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VER%\km\ntddk.h" (
            echo [ERROR] ntddk.h not found
            echo Checking: C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VER%\km\ntddk.h
            dir "C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VER%\km" /b
            exit /b 1
          )
          
          :: Définir les chemins complets
          set WDK_INC=C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VER%
          set WDK_KM_INC=C:\Program Files (x86)\Windows Kits\10\Include\%WDK_VER%\km
          set WDK_LIB=C:\Program Files (x86)\Windows Kits\10\Lib\%WDK_VER%\km\x64
          
          echo WDK_VERSION=%WDK_VER%>> %GITHUB_ENV%
          echo WDK_INC=%WDK_INC%>> %GITHUB_ENV%
          echo WDK_KM_INC=%WDK_KM_INC%>> %GITHUB_ENV%
          echo WDK_LIB=%WDK_LIB%>> %GITHUB_ENV%
          
          echo [INFO] WDK Version: %WDK_VER%
          echo [INFO] WDK Include: %WDK_INC%
          echo [INFO] WDK KM Include: %WDK_KM_INC%
          echo [INFO] WDK Lib: %WDK_LIB%
      
      - name: Build Driver (UNSIGNED - DSE Bypass Ready)
        shell: cmd
        run: |
          call "${{ env.VS_INSTALL_PATH }}\VC\Auxiliary\Build\vcvars64.bat"
          
          :: Configurer les chemins WDK
          set INCLUDE=%WDK_KM_INC%;%WDK_INC%\shared;%INCLUDE%
          set LIB=%WDK_LIB%;%LIB%
          
          echo [INFO] INCLUDE=%INCLUDE%
          echo [INFO] LIB=%LIB%
          
          :: Vérifier que ntddk.h est accessible
          if not exist "%WDK_KM_INC%\ntddk.h" (
            echo [ERROR] ntddk.h still not found at %WDK_KM_INC%\ntddk.h
            dir "%WDK_KM_INC%"
            exit /b 1
          )
          
          :: Builder le driver
          cd hwid-spoofer\driver
          msbuild driver.vcxproj /p:Configuration=Release /p:Platform=x64 /p:OutDir=..\..\bin\ /nologo /m /p:WindowsTargetPlatformVersion=10.0 /p:TargetVersion=Windows10
      
      - name: Build Mapper
        shell: cmd
        run: |
          call "${{ env.VS_INSTALL_PATH }}\VC\Auxiliary\Build\vcvars64.bat"
          cd hwid-spoofer\mapper
          msbuild mapper.vcxproj /p:Configuration=Release /p:Platform=x64 /p:OutDir=..\..\bin\ /nologo /m
      
      - name: Download Intel Exploit Driver
        shell: cmd
        run: |
          powershell -Command "Invoke-WebRequest -Uri 'https://github.com/Ch0pin/medusa/raw/master/iqvw64e.sys' -OutFile 'hwid-spoofer/bin/iqvw64e.sys' -UseBasicParsing"
      
      - name: Create README with Instructions
        shell: cmd
        run: |
          echo ============================================ > hwid-spoofer/bin/README.txt
          echo    Brave HWID Spoofer - DSE Bypass Version     >> hwid-spoofer/bin/README.txt
          echo ============================================ >> hwid-spoofer/bin/README.txt
          echo. >> hwid-spoofer/bin/README.txt
          echo FILES: >> hwid-spoofer/bin/README.txt
          echo   - BraveHWID_Spoof.sys (UNSIGNED - Uses DSE Bypass) >> hwid-spoofer/bin/README.txt
          echo   - mapper.exe (Control Interface) >> hwid-spoofer/bin/README.txt
          echo   - iqvw64e.sys (Intel Exploit for DSE Bypass) >> hwid-spoofer/bin/README.txt
          echo. >> hwid-spoofer/bin/README.txt
          echo USAGE: >> hwid-spoofer/bin/README.txt
          echo   1. Run as Administrator >> hwid-spoofer/bin/README.txt
          echo   2. cd to bin\ folder >> hwid-spoofer/bin/README.txt
          echo   3. mapper.exe BraveHWID_Spoof.sys iqvw64e.sys >> hwid-spoofer/bin/README.txt
          echo   OR: mapper.exe (for interactive menu) >> hwid-spoofer/bin/README.txt
          echo. >> hwid-spoofer/bin/README.txt
          echo NOTE: Driver uses DSE bypass via iqvw64e.sys >> hwid-spoofer/bin/README.txt
          echo       No code signing required! >> hwid-spoofer/bin/README.txt
          echo. >> hwid-spoofer/bin/README.txt
          echo FEATURES: >> hwid-spoofer/bin/README.txt
          echo   - BIOS/Motherboard Serial (SMBIOS) >> hwid-spoofer/bin/README.txt
          echo   - Disk Serial Numbers >> hwid-spoofer/bin/README.txt
          echo   - USB Device Serials >> hwid-spoofer/bin/README.txt
          echo   - Monitor EDID Serial >> hwid-spoofer/bin/README.txt
          echo   - MAC Addresses >> hwid-spoofer/bin/README.txt
          echo   - Volume IDs >> hwid-spoofer/bin/README.txt
          echo   - TPM Endorsement Key >> hwid-spoofer/bin/README.txt
          echo   - CPU Information >> hwid-spoofer/bin/README.txt
          echo   - Anti-Cheat Cleaner (EAC/BE/VAC) >> hwid-spoofer/bin/README.txt
          echo   - ARP Spoofing >> hwid-spoofer/bin/README.txt
          echo ============================================ >> hwid-spoofer/bin/README.txt
      
      - name: List Output Files
        shell: cmd
        run: |
          echo "=== BUILD OUTPUT ==="
          echo "Location: hwid-spoofer/bin/"
          echo ""
          dir hwid-spoofer\bin\ /b
          echo ""
          echo "=== DRIVER STATUS ==="
          echo "BraveHWID_Spoof.sys: UNSIGNED (DSE Bypass via iqvw64e.sys)"
          echo "No signature required - uses CVE-2015-2291 exploit"
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ph3ntom-spoofer-dse-bypass
          path: hwid-spoofer/bin/
          retention-days: 7
