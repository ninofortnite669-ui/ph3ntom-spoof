name: Ph3ntom-Spoofer-Complete

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkUrl = "https://go.microsoft.com/fwlink/?linkid=2249371"
          $wdkPath = "$env:TEMP\wdksetup.exe"
          Invoke-WebRequest -Uri $wdkUrl -OutFile $wdkPath
          Start-Process -FilePath $wdkPath -ArgumentList "/features + /quiet /norestart" -Wait
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      
      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          for /d %%I in ("C:\Program Files (x86)\Windows Kits\10\Include\10.*") do set KITVER=%%~nxI
          set KITINC=C:\Program Files (x86)\Windows Kits\10\Include\%KITVER%
          set KITLIB=C:\Program Files (x86)\Windows Kits\10\Lib\%KITVER%\km\x64
          set INCLUDE=%KITINC%\km;%KITINC%\shared;%KITINC%\km\crt;%INCLUDE%
          set LIB=%KITLIB%;%LIB%
          mkdir bin
          cd extracted\hwid-spoofer\driver
          msbuild driver.vcxproj /p:Configuration=Release /p:Platform=x64 /p:OutDir=..\..\..\bin\ /nologo
          cd ..\mapper
          msbuild mapper.vcxproj /p:Configuration=Release /p:Platform=x64 /p:OutDir=..\..\..\bin\ /nologo
      
      - name: Download Intel Driver
        shell: pwsh
        run: |
          $url = "https://github.com/Ch0pin/medusa/raw/master/iqvw64e.sys"
          $out = "bin/iqvw64e.sys"
          Invoke-WebRequest -Uri $url -OutFile $out
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ph3ntom-binaries
          path: bin/
