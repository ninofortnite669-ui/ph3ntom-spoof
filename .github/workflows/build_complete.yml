name: Ph3ntom-Spoofer-Complete

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0, 18.0)'
      
      - name: Build Everything
        shell: pwsh
        run: |
          # Détecter le WDK
          $wdkBase = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $includePath = "$wdkBase\Include"
          $libPath = "$wdkBase\Lib"
          
          $versionDirs = Get-ChildItem -Path $includePath -Directory | 
                         Where-Object { $_.Name -match "^\d+\.\d+\.\d+\.\d+$" } | 
                         Sort-Object Name -Descending
          
          if ($versionDirs.Count -eq 0) {
            Write-Error "No WDK version found"
            exit 1
          }
          
          $wdkVersion = $versionDirs[0].Name
          $kmPath = "$includePath\$wdkVersion\km"
          $ntddkPath = "$kmPath\ntddk.h"
          
          if (-not (Test-Path $ntddkPath)) {
            Write-Error "ntddk.h not found at: $ntddkPath"
            exit 1
          }
          
          $wdkInc = "$includePath\$wdkVersion"
          $wdkKmInc = "$kmPath"
          $wdkLib = "$libPath\$wdkVersion\km\x64"
          
          $env:INCLUDE = "$wdkKmInc;$wdkInc\shared;$env:INCLUDE"
          $env:LIB = "$wdkLib;$env:LIB"
          
          # Configurer MSBuild
          $vsPath = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise"
          if (-not (Test-Path "$vsPath\VC\Auxiliary\Build\vcvars64.bat")) {
            $vsPath = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise"
          }
          & "$vsPath\VC\Auxiliary\Build\vcvars64.bat"
          
          # Créer dossier de sortie
          if (-not (Test-Path "extracted\hwid-spoofer\bin")) {
            New-Item -ItemType Directory -Path "extracted\hwid-spoofer\bin" -Force | Out-Null
          }
          
          # Compiler le driver
          cd extracted\hwid-spoofer\driver
          & msbuild driver.vcxproj /p:Configuration=Release /p:Platform=x64 /p:OutDir=..\..\..\bin\ /nologo /m /p:WindowsTargetPlatformVersion=10.0
          if ($LASTEXITCODE -ne 0) { exit 1 }
          
          # Compiler le mapper
          cd ..\mapper
          & msbuild mapper.vcxproj /p:Configuration=Release /p:Platform=x64 /p:OutDir=..\..\..\bin\ /nologo /m
          if ($LASTEXITCODE -ne 0) { exit 1 }
      
      - name: Download Intel Driver
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/Ch0pin/medusa/raw/master/iqvw64e.sys' -OutFile 'extracted/hwid-spoofer/bin/iqvw64e.sys' -UseBasicParsing
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ph3ntom-binaries
          path: extracted/hwid-spoofer/bin/
