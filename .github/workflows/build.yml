name: Ph3ntom-Spoofer-Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hwid-spoofer/**'

jobs:
  build:
    runs-on: windows-2022
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0, 18.0)'
      
      - name: Build Everything
        shell: pwsh
        run: |
          # ============================================
          # ÉTAPE 1: Détecter le WDK
          # ============================================
          Write-Host "=== Détection du WDK ==="
          
          $wdkBase = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $includePath = "$wdkBase\Include"
          $libPath = "$wdkBase\Lib"
          
          if (-not (Test-Path $includePath)) {
            Write-Error "WDK Include path introuvable: $includePath"
            exit 1
          }
          
          # Trouver les dossiers de version (ex: 10.0.26100.0)
          $versionDirs = Get-ChildItem -Path $includePath -Directory | 
                         Where-Object { $_.Name -match "^\d+\.\d+\.\d+\.\d+$" } | 
                         Sort-Object Name -Descending
          
          if ($versionDirs.Count -eq 0) {
            Write-Error "Aucun dossier de version WDK trouvé"
            Get-ChildItem -Path $includePath -Directory | Select-Object Name
            exit 1
          }
          
          $wdkVersion = $versionDirs[0].Name
          Write-Host "Version WDK trouvée: $wdkVersion"
          
          # Vérifier ntddk.h
          $kmPath = "$includePath\$wdkVersion\km"
          $ntddkPath = "$kmPath\ntddk.h"
          
          if (-not (Test-Path $ntddkPath)) {
            Write-Error "ntddk.h introuvable à: $ntddkPath"
            exit 1
          }
          
          Write-Host "WDK vérifié: ntddk.h trouvé"
          
          # ============================================
          # ÉTAPE 2: Configurer l'environnement Visual Studio
          # ============================================
          Write-Host "=== Configuration de l'environnement ==="
          
          $vsPath = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise"
          if (-not (Test-Path "$vsPath\VC\Auxiliary\Build\vcvars64.bat")) {
            $vsPath = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise"
          }
          
          # Appeler vcvars64.bat pour configurer MSBuild
          $vcvarsPath = "$vsPath\VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvarsPath)) {
            Write-Error "vcvars64.bat introuvable à: $vcvarsPath"
            exit 1
          }
          
          Write-Host "Appel de vcvars64.bat..."
          & $vcvarsPath
          
          # ============================================
          # ÉTAPE 3: Configurer les chemins WDK
          # ============================================
          Write-Host "=== Configuration des chemins WDK ==="
          
          $wdkInc = "$includePath\$wdkVersion"
          $wdkKmInc = "$kmPath"
          $wdkLib = "$libPath\$wdkVersion\km\x64"
          
          # Ajouter les chemins WDK aux variables d'environnement
          $env:INCLUDE = "$wdkKmInc;$wdkInc\shared;$env:INCLUDE"
          $env:LIB = "$wdkLib;$env:LIB"
          
          Write-Host "INCLUDE: $env:INCLUDE"
          Write-Host "LIB: $env:LIB"
          
          # ============================================
          # ÉTAPE 4: Créer le dossier de sortie
          # ============================================
          Write-Host "=== Création du dossier de sortie ==="
          if (-not (Test-Path "hwid-spoofer\bin")) {
            New-Item -ItemType Directory -Path "hwid-spoofer\bin" -Force | Out-Null
          }
          
          # ============================================
          # ÉTAPE 5: Compiler le driver
          # ============================================
          Write-Host "=== Compilation du driver ==="
          
          cd hwid-spoofer\driver
          
          # Compiler avec msbuild
          $msbuildArgs = @(
            "driver.vcxproj",
            "/p:Configuration=Release",
            "/p:Platform=x64",
            "/p:OutDir=..\..\bin\",
            "/nologo",
            "/m",
            "/p:WindowsTargetPlatformVersion=10.0"
          )
          
          try {
            & msbuild $msbuildArgs
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Échec de la compilation du driver (code: $LASTEXITCODE)"
              exit 1
            }
            Write-Host "Driver compilé avec succès"
          } catch {
            Write-Error "Exception lors de la compilation: $_"
            exit 1
          }
          
          # ============================================
          # ÉTAPE 6: Compiler le mapper
          # ============================================
          Write-Host "=== Compilation du mapper ==="
          
          cd ..\mapper
          
          $msbuildArgs = @(
            "mapper.vcxproj",
            "/p:Configuration=Release",
            "/p:Platform=x64",
            "/p:OutDir=..\..\bin\",
            "/nologo",
            "/m"
          )
          
          try {
            & msbuild $msbuildArgs
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Échec de la compilation du mapper (code: $LASTEXITCODE)"
              exit 1
            }
            Write-Host "Mapper compilé avec succès"
          } catch {
            Write-Error "Exception lors de la compilation: $_"
            exit 1
          }
      
      - name: Download Intel Exploit Driver
        shell: pwsh
        run: |
          Write-Host "=== Téléchargement de iqvw64e.sys ==="
          $url = "https://github.com/Ch0pin/medusa/raw/master/iqvw64e.sys"
          $out = "hwid-spoofer/bin/iqvw64e.sys"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          if (-not (Test-Path $out)) {
            Write-Error "Échec du téléchargement de iqvw64e.sys"
            exit 1
          }
          Write-Host "iqvw64e.sys téléchargé"
      
      - name: Create README
        shell: pwsh
        run: |
          Write-Host "=== Création du README ==="
          $readmePath = "hwid-spoofer/bin/README.txt"
          @"
============================================
    Brave HWID Spoofer - DSE Bypass Version
============================================

FILES:
  - BraveHWID_Spoof.sys (UNSIGNED - Uses DSE Bypass)
  - mapper.exe (Control Interface)
  - iqvw64e.sys (Intel Exploit for DSE Bypass)

USAGE:
  1. Run as Administrator
  2. cd to bin\ folder
  3. mapper.exe BraveHWID_Spoof.sys iqvw64e.sys
     OR: mapper.exe (for interactive menu)

NOTE: Driver uses DSE bypass via iqvw64e.sys
      No code signing required!

FEATURES:
  - BIOS/Motherboard Serial (SMBIOS)
  - Disk Serial Numbers
  - USB Device Serials
  - Monitor EDID Serial
  - MAC Addresses
  - Volume IDs
  - TPM Endorsement Key
  - CPU Information
  - Anti-Cheat Cleaner (EAC/BE/VAC)
  - ARP Spoofing
============================================
"@ | Out-File -FilePath $readmePath -Encoding ASCII
      
      - name: List Output Files
        shell: pwsh
        run: |
          Write-Host "=== Fichiers générés ==="
          Get-ChildItem -Path "hwid-spoofer/bin" | Select-Object Name, Length, LastWriteTime
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ph3ntom-spoofer-dse-bypass
          path: hwid-spoofer/bin/
          retention-days: 7
