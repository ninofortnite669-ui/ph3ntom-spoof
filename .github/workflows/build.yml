name: Ph3ntom-Spoofer-Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hwid-spoofer/**'

jobs:
  build:
    runs-on: windows-2022
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install WDK and Visual Studio Build Tools
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0, 18.0)'
          msbuild-architecture: x64
      
      - name: Setup WDK Environment
        shell: pwsh
        run: |
          # Le WDK est inclus avec Visual Studio 2022 sur GitHub Actions
          # Vérifions le chemin du SDK Windows
          $vsInstallDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise"
          $wdkInclude = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
          
          Write-Host "Checking VS Install Dir: $vsInstallDir"
          Write-Host "Checking WDK Include Dir: $wdkInclude"
          
          # Lister ce qui existe
          if (Test-Path "$vsInstallDir") {
            Write-Host "VS 2022 found at: $vsInstallDir"
          } else {
            Write-Host "VS 2022 NOT found at: $vsInstallDir"
          }
          
          if (Test-Path "$wdkInclude") {
            Write-Host "WDK Include found at: $wdkInclude"
            $versions = Get-ChildItem -Path "$wdkInclude" -Directory | Where-Object { $_.Name -match "^10\.\d+\.\d+\.\d+$" } | Sort-Object Name -Descending
            if ($versions.Count -gt 0) {
              $latestVersion = $versions[0].Name
              Write-Host "Latest WDK version: $latestVersion"
              
              $ntddkPath = "$wdkInclude\$latestVersion\km\ntddk.h"
              if (Test-Path $ntddkPath) {
                Write-Host "ntddk.h found at: $ntddkPath"
                # Stocker la version pour les étapes suivantes
                Add-Content -Path $env:GITHUB_ENV -Value "WDK_VERSION=$latestVersion"
                Add-Content -Path $env:GITHUB_ENV -Value "WDK_INCLUDE=$wdkInclude\$latestVersion"
                Add-Content -Path $env:GITHUB_ENV -Value "WDK_KM_INCLUDE=$wdkInclude\$latestVersion\km"
                Add-Content -Path $env:GITHUB_ENV -Value "WDK_LIB=$env:ProgramFiles(x86)\Windows Kits\10\Lib\$latestVersion\km\x64"
                exit 0
              } else {
                Write-Error "ntddk.h NOT found at: $ntddkPath"
                Get-ChildItem -Path "$wdkInclude\$latestVersion\km" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
                exit 1
              }
            } else {
              Write-Error "No WDK version directories found"
              Get-ChildItem -Path "$wdkInclude" -Directory | Select-Object Name
              exit 1
            }
          } else {
            Write-Error "WDK Include directory NOT found at: $wdkInclude"
            # Essayons de trouver où est le WDK
            Write-Host "Searching for WDK..."
            Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits" -Recurse -Directory -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }
      
      - name: Create Output Directory
        run: mkdir -p hwid-spoofer\bin
        shell: cmd
      
      - name: Build Driver (UNSIGNED - DSE Bypass Ready)
        shell: cmd
        run: |
          call "${{ env.VS_INSTALL_PATH }}\VC\Auxiliary\Build\vcvars64.bat"
          
          :: Utiliser les variables d'environnement définies par PowerShell
          set KITVER=%WDK_VERSION%
          set KITINC=%WDK_KM_INCLUDE%
          set KITLIB=%WDK_LIB%
          
          echo [INFO] WDK Version: %KITVER%
          echo [INFO] WDK Include: %KITINC%
          echo [INFO] WDK Lib: %KITLIB%
          
          :: Vérifier que ntddk.h existe
          if not exist "%KITINC%\ntddk.h" (
            echo [ERROR] ntddk.h not found at %KITINC%\ntddk.h
            dir "%KITINC%"
            exit /b 1
          )
          
          :: Configurer les chemins
          set INCLUDE=%KITINC%;%KITINC%\..\shared;%INCLUDE%
          set LIB=%KITLIB%;%LIB%
          
          :: Builder le driver
          cd hwid-spoofer\driver
          msbuild driver.vcxproj /p:Configuration=Release /p:Platform=x64 /p:OutDir=..\..\bin\ /nologo /m /p:WindowsTargetPlatformVersion=10.0 /p:TargetVersion=Windows10
      
      - name: Build Mapper
        shell: cmd
        run: |
          call "${{ env.VS_INSTALL_PATH }}\VC\Auxiliary\Build\vcvars64.bat"
          cd hwid-spoofer\mapper
          msbuild mapper.vcxproj /p:Configuration=Release /p:Platform=x64 /p:OutDir=..\..\bin\ /nologo /m
      
      - name: Download Intel Exploit Driver
        shell: pwsh
        run: |
          $url = "https://github.com/Ch0pin/medusa/raw/master/iqvw64e.sys"
          $out = "hwid-spoofer/bin/iqvw64e.sys"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
      
      - name: Create README with Instructions
        shell: cmd
        run: |
          echo ============================================ > hwid-spoofer/bin/README.txt
          echo    Ph3ntom Spoofer - DSE Bypass Version      >> hwid-spoofer/bin/README.txt
          echo ============================================ >> hwid-spoofer/bin/README.txt
          echo. >> hwid-spoofer/bin/README.txt
          echo FILES: >> hwid-spoofer/bin/README.txt
          echo   - BraveHWID_Spoof.sys (UNSIGNED - Uses DSE Bypass) >> hwid-spoofer/bin/README.txt
          echo   - mapper.exe (Control Interface) >> hwid-spoofer/bin/README.txt
          echo   - iqvw64e.sys (Intel Exploit for DSE Bypass) >> hwid-spoofer/bin/README.txt
          echo. >> hwid-spoofer/bin/README.txt
          echo USAGE: >> hwid-spoofer/bin/README.txt
          echo   1. Run as Administrator >> hwid-spoofer/bin/README.txt
          echo   2. cd to bin\ folder >> hwid-spoofer/bin/README.txt
          echo   3. mapper.exe BraveHWID_Spoof.sys iqvw64e.sys >> hwid-spoofer/bin/README.txt
          echo   OR: mapper.exe (for interactive menu) >> hwid-spoofer/bin/README.txt
          echo. >> hwid-spoofer/bin/README.txt
          echo NOTE: Driver uses DSE bypass via iqvw64e.sys >> hwid-spoofer/bin/README.txt
          echo       No code signing required! >> hwid-spoofer/bin/README.txt
          echo. >> hwid-spoofer/bin/README.txt
          echo FEATURES: >> hwid-spoofer/bin/README.txt
          echo   - BIOS/Motherboard Serial (SMBIOS) >> hwid-spoofer/bin/README.txt
          echo   - Disk Serial Numbers >> hwid-spoofer/bin/README.txt
          echo   - USB Device Serials >> hwid-spoofer/bin/README.txt
          echo   - Monitor EDID Serial >> hwid-spoofer/bin/README.txt
          echo   - MAC Addresses >> hwid-spoofer/bin/README.txt
          echo   - Volume IDs >> hwid-spoofer/bin/README.txt
          echo   - TPM Endorsement Key >> hwid-spoofer/bin/README.txt
          echo   - CPU Information >> hwid-spoofer/bin/README.txt
          echo   - Anti-Cheat Cleaner (EAC/BE/VAC) >> hwid-spoofer/bin/README.txt
          echo   - ARP Spoofing >> hwid-spoofer/bin/README.txt
          echo ============================================ >> hwid-spoofer/bin/README.txt
      
      - name: List Output Files
        shell: cmd
        run: |
          echo "=== BUILD OUTPUT ==="
          echo "Location: hwid-spoofer/bin/"
          echo ""
          dir hwid-spoofer\bin\ /b
          echo ""
          echo "=== DRIVER STATUS ==="
          echo "BraveHWID_Spoof.sys: UNSIGNED (DSE Bypass via iqvw64e.sys)"
          echo "No signature required - uses CVE-2015-2291 exploit"
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ph3ntom-spoofer-dse-bypass
          path: hwid-spoofer/bin/
          retention-days: 7
