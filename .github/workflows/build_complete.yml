name: Ph3ntom-Spoofer-Complete

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkUrl = "https://go.microsoft.com/fwlink/?linkid=2249371"
          $wdkPath = "$env:TEMP\wdksetup.exe"
          Invoke-WebRequest -Uri $wdkUrl -OutFile $wdkPath -UseBasicParsing
          Start-Process -FilePath $wdkPath -ArgumentList "/features + /quiet /norestart" -Wait
          
          # Verify WDK installation
          $wdkInclude = "C:\Program Files (x86)\Windows Kits\10\Include"
          if (-not (Test-Path "$wdkInclude")) {
            Write-Error "WDK Include directory not found at $wdkInclude"
            exit 1
          }
          
          # Find the latest WDK version
          $versions = Get-ChildItem -Path "$wdkInclude" -Directory | Where-Object { $_.Name -match "^10\.\d+\.\d+\.\d+$" } | Sort-Object Name -Descending
          if ($versions.Count -eq 0) {
            Write-Error "No WDK version found in $wdkInclude"
            Get-ChildItem -Path "$wdkInclude" -Directory | Select-Object Name
            exit 1
          }
          
          $latestVersion = $versions[0].Name
          Write-Host "Found WDK version: $latestVersion"
          
          # Verify ntddk.h exists
          $ntddkPath = "$wdkInclude\$latestVersion\km\ntddk.h"
          if (-not (Test-Path $ntddkPath)) {
            Write-Error "ntddk.h not found at $ntddkPath"
            Get-ChildItem -Path "$wdkInclude\$latestVersion\km" -Recurse | Select-Object FullName
            exit 1
          }
          
          Write-Host "WDK verified: ntddk.h found at $ntddkPath"
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      
      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          
          :: Find WDK version
          for /d %%I in ("C:\Program Files (x86)\Windows Kits\10\Include\10.*") do set KITVER=%%~nxI
          if "%KITVER%"=="" (
            echo [ERROR] WDK Include directory not found
            dir "C:\Program Files (x86)\Windows Kits\10\Include"
            exit /b 1
          )
          
          :: Setup WDK paths
          set KITINC=C:\Program Files (x86)\Windows Kits\10\Include\%KITVER%\km
          set KITLIB=C:\Program Files (x86)\Windows Kits\10\Lib\%KITVER%\km\x64
          
          :: Verify ntddk.h exists
          if not exist "%KITINC%\ntddk.h" (
            echo [ERROR] ntddk.h not found at %KITINC%\ntddk.h
            dir "%KITINC%"
            exit /b 1
          )
          
          :: Add WDK to include path
          set INCLUDE=%KITINC%;%KITINC%\..\shared;%INCLUDE%
          set LIB=%KITLIB%;%LIB%
          
          echo [INFO] WDK Version: %KITVER%
          echo [INFO] WDK Include: %KITINC%
          echo [INFO] WDK Lib: %KITLIB%
          
          mkdir bin
          cd extracted\hwid-spoofer\driver
          msbuild driver.vcxproj /p:Configuration=Release /p:Platform=x64 /p:OutDir=..\..\..\bin\ /nologo /m /p:WindowsTargetPlatformVersion=10.0 /p:TargetVersion=Windows10
          cd ..\mapper
          msbuild mapper.vcxproj /p:Configuration=Release /p:Platform=x64 /p:OutDir=..\..\..\bin\ /nologo /m
      
      - name: Download Intel Driver
        shell: pwsh
        run: |
          $url = "https://github.com/Ch0pin/medusa/raw/master/iqvw64e.sys"
          $out = "bin/iqvw64e.sys"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ph3ntom-binaries
          path: bin/
